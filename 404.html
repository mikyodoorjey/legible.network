<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Not found · Subnet Legibility Index</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#ffffff;--ink:#1d1d1f;--soft:#6e6e73;--softer:#86868b;--tag:#bf2d24;--rule:#d2d2d7}
  :root[data-theme="dark"]{--bg:#000;--ink:#f5f5f7;--soft:#86868b;--softer:#6e6e73;--tag:#ff6961;--rule:#424245}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;background-image:repeating-linear-gradient(90deg,rgba(128,128,128,.06) 0 1px,transparent 1px 96px)}
  header{padding:22px 32px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule)}
  .name{font-family:-apple-system,BlinkMacSystemFont,'Geist',sans-serif;font-size:20px;font-weight:600;letter-spacing:-.03em;text-decoration:none;color:var(--ink)}
  .code{font-family:'Fira Code',ui-monospace,monospace;font-size:11px;letter-spacing:.1em;color:var(--softer)}
  main{flex:1;display:flex;align-items:center;padding:60px 32px}
  .wrap{max-width:680px}
  h1{font-family:-apple-system,BlinkMacSystemFont,'Geist','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:clamp(38px,6vw,64px);line-height:.98;letter-spacing:-.04em;margin:0 0 20px}
  h1 em{color:var(--tag);font-style:normal}
  p{font-size:17px;line-height:1.55;color:var(--soft);margin:0 0 28px}
  nav a{display:inline-block;margin:0 18px 10px 0;color:var(--ink);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px;font-size:15px}
  nav a:hover{color:var(--tag)}
</style>
</head>
<body>
<header><a class="name" href="/">Legible</a><span class="code">404 · NOT FOUND</span></header>
<main><div class="wrap">
  <h1>That page is not here. <em>The rest of the site is.</em></h1>
  <p>The address may have moved or never existed. These are the pages that do.</p>
  <nav>
    <a href="/">The argument</a>
    <a href="/sn/">Subnets</a>
    <a href="/narrative/">Voices</a>
    <a href="/method/">Method</a>
    <a href="/about/">About</a>
  </nav>
</div></main>
</body>
</html>
