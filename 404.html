<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Not found · Subnet Legibility Index</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f6f3;--ink:#1a1a1a;--soft:#6b6b6b;--softer:#8a8a8a;--tag:#e72630;--rule:#e4e2dd}
  @media (prefers-color-scheme:dark){:root{--bg:#0e0e0e;--ink:#f2f2f2;--soft:#9a9a9a;--softer:#777;--rule:#262626}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;background-image:repeating-linear-gradient(90deg,rgba(128,128,128,.06) 0 1px,transparent 1px 96px)}
  header{padding:22px 32px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule)}
  .name{font-family:'Inter Tight','Inter',sans-serif;font-size:20px;font-weight:600;letter-spacing:-.03em;text-decoration:none;color:var(--ink)}
  .code{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--softer)}
  main{flex:1;display:flex;align-items:center;padding:60px 32px}
  .wrap{max-width:680px}
  h1{font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:clamp(38px,6vw,64px);line-height:.98;letter-spacing:-.04em;margin:0 0 20px}
  h1 em{color:var(--tag);font-style:normal}
  p{font-size:17px;line-height:1.55;color:var(--soft);margin:0 0 28px}
  nav a{display:inline-block;margin:0 18px 10px 0;color:var(--ink);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px;font-size:15px}
  nav a:hover{color:var(--tag)}
</style>
</head>
<body>
<header><a class="name" href="/">Legible</a><span class="code">404 · NOT FOUND</span></header>
<main><div class="wrap">
  <h1>That page is not here. <em>The rest of the site is.</em></h1>
  <p>The address may have moved or never existed. These are the pages that do.</p>
  <nav>
    <a href="/">The argument</a>
    <a href="/sn/">Subnets</a>
    <a href="/narrative/">Voices</a>
    <a href="/method/">Method</a>
    <a href="/about/">About</a>
  </nav>
</div></main>
</body>
</html>
