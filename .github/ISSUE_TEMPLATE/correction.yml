name: Correction
description: A wrong legibility score, a misquote or misdated quote in the map, or a dead link
title: "[Correction] "
labels: [correction]
body:
  - type: dropdown
    id: about
    attributes: { label: What is this about, options: ["a legibility score on the index", "a quote in the map", "a link, on either side", "something else"] }
    validations: { required: true }
  - type: input
    id: subject
    attributes: { label: Subnet or narrator, placeholder: "SN64 Chutes, or jacob-steeves" }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: The cell or the statement id, description: "For a score: audience and question, like buyers q2. For a quote: the id shown on it, like jacob-steeves-014.", placeholder: "buyers q2, or jacob-steeves-014" }
  - type: textarea
    id: wrong
    attributes: { label: What is wrong, description: "What Legible says, and what the source actually shows or says." }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: Source URL, description: "The public page a first-time reader would find this on, or the primary source of the quote." }
    validations: { required: true }
